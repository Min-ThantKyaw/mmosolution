# Render Blueprint — deploys the backend API + its PostgreSQL database.
# Docs: https://render.com/docs/blueprint-spec
# Import at https://dashboard.render.com/blueprints (or "New +" → Blueprint).

databases:
  - name: blog-db
    plan: free

services:
  - type: web
    name: blog-backend
    runtime: node
    rootDir: backend
    plan: free
    buildCommand: npm install && npx prisma generate && npx prisma migrate deploy && npm run build
    startCommand: npm start
    healthCheckPath: /
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: HOST
        value: 0.0.0.0
      # Render injects PORT itself; no need to set it here.
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRES_IN
        value: "3600"
      # Set this in the Render dashboard after provisioning:
      # the Vercel frontend URL, e.g. https://my-app.vercel.app
      - key: CORS_ORIGIN
        sync: false
      - key: DATABASE_URL
        fromDatabase:
          name: blog-db
          property: connectionString
